<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSB Psych Lab</title>
<meta name="description" content="Daily SSB psychology practice: TAT, WAT, SRT and SD in real board timings, with an instant OLQ assessment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261118a">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand"><i aria-hidden="true"></i><span>SSB Psych Lab</span></div>
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <span class="chest" id="chest">SSB PSYCH PRACTICE</span>
        <span id="userBtns" class="row" style="gap:6px;flex-wrap:nowrap" hidden>
          <a class="btn quiet" id="hqBtn" href="admin.html" hidden style="padding:4px 10px;font-size:13px;text-decoration:none">HQ</a>
          <button class="btn quiet" id="feedbackBtn" style="padding:4px 10px;font-size:13px">Feedback</button>
          <button class="btn quiet" id="settingsBtn" style="padding:4px 10px;font-size:13px">Profile</button>
          <button class="btn quiet" id="logoutBtn" style="padding:4px 10px;font-size:13px">Log out</button>
        </span>
      </div>
    </div>
    <nav class="tabs" id="nav" aria-label="Sections" hidden>
      <button class="tab" data-view="today">Today</button>
      <button class="tab" data-view="progress">Progress</button>
      <button class="tab" data-view="interview">Interview<span class="soon">soon</span></button>
    </nav>
  </div>
</header>
<main id="main"></main>
<div id="layer"></div>
<div id="modalLayer"></div>

<!-- content banks (plain scripts so the app works by double-clicking index.html) -->
<script src="data/wat.js?v=20261118a"></script>
<script src="data/srt.js?v=20261118a"></script>
<script src="data/tat.js?v=20261118a"></script>

<script src="js/engine.js?v=20261118a"></script>
<script src="js/store.js?v=20261118a"></script>
<script src="js/app.js?v=20261118a"></script>
</body>
</html>
