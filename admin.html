<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SSB Psych Lab · HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261118a">
<link rel="stylesheet" href="css/admin.css?v=20261118a">
</head>
<body class="hq">
<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand"><i aria-hidden="true"></i><span>SSB Psych Lab</span><b class="hqtag">HQ</b></div>
      <div class="row" style="gap:8px;flex-wrap:nowrap" id="hqActions" hidden>
        <div class="seg" role="group" aria-label="Date range" id="range">
          <button data-days="7">7d</button><button data-days="30" aria-pressed="true">30d</button><button data-days="90">90d</button>
        </div>
        <button class="btn quiet" id="refresh" style="padding:6px 10px" aria-label="Refresh data">↻</button>
      </div>
    </div>
    <nav class="tabs" id="hqNav" aria-label="Dashboard sections" hidden>
      <button class="tab" data-tab="overview" aria-current="page">Overview</button>
      <button class="tab" data-tab="candidates">Candidates</button>
      <button class="tab" data-tab="feedback">Feedback</button>
    </nav>
  </div>
</header>
<main id="hq" class="hqmain"></main>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="scrim" class="scrim" hidden></div>
<div id="tip" class="vtip" role="tooltip"></div>
<div id="modalLayer"></div>

<script src="js/config.js?v=20261118a"></script>
<script src="js/store.js?v=20261118a"></script>
<script src="js/admin.js?v=20261118a"></script>
</body>
</html>
